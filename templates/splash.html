<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{ club_name }}</title>
    <link href="{{ url_for('static', filename='favicon.ico') }}" rel="icon" type="image/x-icon">
    <!-- 本地偏好初始化：与全站共用 anime_club_theme / _font / _motion，尽早执行避免闪烁 -->
    <script>
    (function () {
        try {
            var root = document.documentElement;
            var saved = localStorage.getItem('anime_club_theme');
            var theme = (saved === 'dark' || saved === 'light')
                ? saved
                : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            if (theme === 'dark') root.setAttribute('data-theme', 'dark');
            var font = localStorage.getItem('anime_club_font');
            if (font === 'large' || font === 'xlarge') root.setAttribute('data-font', font);
            if (localStorage.getItem('anime_club_motion') === 'reduced') root.setAttribute('data-motion', 'reduced');
        } catch (e) {}
    })();
    </script>
    <style>
        :root {
            --splash-bg: linear-gradient(135deg, #e0f0ff 0%, #f0e6ff 50%, #ffe6f0 100%);
            --splash-text: #2c3e50;
            --splash-sub: #34495e;
            --splash-muted: #7f8c8d;
            --splash-accent: #4a90d9;
            --splash-btn-bg: rgba(255, 255, 255, 0.5);
            --splash-btn-shadow: rgba(74, 144, 217, 0.15);
        }

        [data-theme="dark"] {
            --splash-bg: linear-gradient(135deg, #0a1220 0%, #16203a 50%, #1d1730 100%);
            --splash-text: #e9eefb;
            --splash-sub: #c3d2e8;
            --splash-muted: #9fb0c9;
            --splash-accent: #7fb6ff;
            --splash-btn-bg: rgba(255, 255, 255, 0.08);
            --splash-btn-shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            /* 短屏 / 横向手机也能滚动，避免按钮被裁掉 */
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            background: var(--splash-bg);
            background-attachment: fixed;
            transition: background 0.3s ease;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .splash-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            text-align: center;
            padding: 20px;
            color: var(--splash-text);
        }

        .splash-content h1 {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 0.3em;
            background: linear-gradient(135deg, #4a90d9, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(74, 144, 217, 0.2);
            letter-spacing: 2px;
        }

        .splash-content .subtitle {
            font-size: 1.5rem;
            margin-bottom: 1.8em;
            color: var(--splash-sub);
            opacity: 0.85;
            letter-spacing: 6px;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-block;
            padding: 14px 50px;
            border: 2px solid var(--splash-accent);
            border-radius: 50px;
            color: var(--splash-accent);
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            background: var(--splash-btn-bg);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--splash-btn-shadow);
        }

        .btn-enter:hover {
            background: var(--splash-accent);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 8px 40px var(--splash-btn-shadow);
        }

        .footer-note {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--splash-muted);
            opacity: 0.75;
            letter-spacing: 2px;
        }

        /* 昼夜切换按钮：入口页也能换主题（与内页共用同一偏好） */
        .splash-theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 5;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            border: 1px solid var(--splash-accent);
            background: var(--splash-btn-bg);
            backdrop-filter: blur(8px);
            color: var(--splash-accent);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .splash-theme-toggle:hover {
            transform: translateY(-2px);
            background: var(--splash-accent);
            color: #fff;
        }

        [data-theme="dark"] .splash-content h1 {
            background: linear-gradient(135deg, #8cc4ff, #c9a4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .splash-content h1 {
                font-size: 2.8rem;
            }

            .splash-content .subtitle {
                font-size: 1rem;
                letter-spacing: 3px;
            }

            .btn-enter {
                padding: 12px 30px;
                font-size: 1rem;
            }

            .footer-note {
                bottom: 16px;
                font-size: 0.78rem;
            }
        }

        /* 极矮屏（横屏手机）：确保内容不被裁切 */
        @media (max-height: 520px) {
            .splash-content {
                padding: 60px 20px 50px;
            }

            .splash-content h1 {
                font-size: 2.2rem;
            }

            .splash-content .subtitle {
                font-size: 0.9rem;
                margin-bottom: 1em;
            }

            .footer-note {
                position: static;
                margin-top: 24px;
            }
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<img class="wechat-thumb" src="{{ url_for('static', filename='images/splash-cover.jpg') }}?v={{ app_version }}"
     alt="{{ club_name }}封面缩略图" width="300" height="300" aria-hidden="true"
     style="position:absolute; left:-9999px; top:0; width:300px; height:300px; opacity:0.01; pointer-events:none;">

<button type="button" class="splash-theme-toggle" id="splash-theme-toggle" aria-label="切换昼夜模式" title="切换昼夜模式">🌙</button>
<div class="splash-content">
    <h1>{{ club_name }}</h1>
    <p class="subtitle">以热爱为名 · 共创二次元家园</p>
    <a class="btn-enter" href="/home">进入社团</a>
    <div class="footer-note">欢迎来到我们的二次元世界</div>
</div>

<script>
    (function () {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let mouseX = -1000, mouseY = -1000;
        let time = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        const numLines = 45;
        const amp = 55;
        const freq = 0.028;
        const speed = 0.5;
        const mouseInfluence = 70;
        const step = 3;

        const phases = [];
        for (let i = 0; i < numLines; i++) {
            phases.push(i * 0.7 + 0.3);
        }

        function drawWaves() {
            ctx.clearRect(0, 0, W, H);

            // 背景渐变
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, 'rgba(224, 240, 255, 0.10)');
            grad.addColorStop(0.5, 'rgba(240, 230, 255, 0.06)');
            grad.addColorStop(1, 'rgba(255, 230, 240, 0.10)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 偏移范围：从 -H 到 W
            const offsetMin = -H - 50;
            const offsetMax = W + 50;

            // 基础线条
            for (let i = 0; i < numLines; i++) {
                const offset = offsetMin + (i / (numLines - 1)) * (offsetMax - offsetMin);

                ctx.beginPath();
                let first = true;
                const xStart = -200;
                const xEnd = W + 200;
                for (let x = xStart; x <= xEnd; x += step) {
                    let y_base = x + offset;
                    let wave = amp * Math.sin(x * freq + time * speed + phases[i]);
                    let mouseBend = 0;
                    const dx = x - mouseX;
                    const dy = y_base - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        const factor = (200 - dist) / 200;
                        mouseBend = mouseInfluence * factor * Math.sin((x - mouseX) * 0.02);
                    }
                    let y = y_base + wave + mouseBend;
                    if (first) {
                        ctx.moveTo(x, y);
                        first = false;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                const alpha = 0.2 + 0.2 * (i / numLines);
                ctx.strokeStyle = `rgba(180, 210, 255, ${alpha})`;
                ctx.lineWidth = 1.6;
                ctx.stroke();
            }

            // 少量高亮线条
            for (let i = 4; i < numLines; i += 6) {
                const offset = offsetMin + (i / (numLines - 1)) * (offsetMax - offsetMin);
                ctx.beginPath();
                let first = true;
                const xStart = -200;
                const xEnd = W + 200;
                for (let x = xStart; x <= xEnd; x += step) {
                    let y_base = x + offset;
                    let wave = amp * Math.sin(x * freq + time * speed + phases[i] + 1.8);
                    let mouseBend = 0;
                    const dx = x - mouseX;
                    const dy = y_base - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        const factor = (200 - dist) / 200;
                        mouseBend = mouseInfluence * factor * Math.sin((x - mouseX) * 0.02);
                    }
                    let y = y_base + wave + mouseBend;
                    if (first) {
                        ctx.moveTo(x, y);
                        first = false;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.strokeStyle = 'rgba(220, 235, 255, 0.5)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }
        }

        // 鼠标事件
        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        document.addEventListener('touchmove', e => {
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        }, {passive: true});
        document.addEventListener('touchend', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        function animate() {
            requestAnimationFrame(animate);
            time += 0.03;
            drawWaves();
        }

        animate();
    })();
</script>
<script>
    // 昼夜切换：与全站共用 anime_club_theme，进入内页后主题保持一致
    (function () {
        var btn = document.getElementById('splash-theme-toggle');
        if (!btn) return;
        var KEY = 'anime_club_theme';

        function paint() {
            btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
        }

        paint();
        btn.addEventListener('click', function () {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem(KEY, 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem(KEY, 'dark');
            }
            paint();
        });
    })();
</script>
</body>
</html>
