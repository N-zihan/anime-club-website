{% extends "base.html" %}
{% block title %}设置新密码{% endblock %}
{% block content %}

<div class="u-0079990c">

    <div class="u-ea57f62b">
        <h2 class="u-3396091c">设置新密码</h2>

        <form method="POST">
            <input type="password" name="password" placeholder="新密码（至少6位）" required class="u-03cdc0d1">
            <input type="password" name="confirm" placeholder="确认新密码" required class="u-5fe3d7d7">
            <button type="submit" class="btn-primary u-6313cb4c">确认修改</button>
        </form>
    </div>

</div>

{% endblock %}
