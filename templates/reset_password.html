<!-- reset_password.html -->
{% extends "base.html" %}
{% block title %}设置新密码{% endblock %}
{% block content %}

<div style="max-width:420px; margin:0 auto; padding:20px 0;">

    <div style="background: var(--bg-card); padding:32px 28px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); border:1px solid var(--border-color);">
        <h2 style="margin-top:0; margin-bottom:24px; text-align:center; color: var(--text-primary);">设置新密码</h2>

        <form method="POST">
            <input type="password" name="password" placeholder="新密码（至少6位）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <input type="password" name="confirm" placeholder="确认新密码" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:16px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:16px; border:none; border-radius:8px; cursor:pointer;">确认修改</button>
        </form>
    </div>

</div>

{% endblock %}
