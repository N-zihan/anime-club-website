{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="u-0079990c">

    <div class="u-ea57f62b">
        <h2 class="u-83413b95">修改密码</h2>

        <form method="POST">
            <input type="password" name="old_password" placeholder="原密码" required class="u-03cdc0d1">
            <input type="password" name="new_password" placeholder="新密码（至少6位）" required minlength="6" class="u-03cdc0d1">
            <input type="password" name="confirm_password" placeholder="确认新密码" required minlength="6" class="u-5fe3d7d7">
            <button type="submit" class="btn-primary u-6313cb4c">确认修改</button>
        </form>

        <p class="u-efbce96b">
            <a href="{{ url_for('user.profile') }}" class="u-bf4b6787">← 返回个人设置</a>
        </p>
    </div>

</div>

{% endblock %}
