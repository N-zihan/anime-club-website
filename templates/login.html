{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}

<div class="u-8faf1095">


    <div class="u-ea57f62b">
        <h2 class="u-3396091c">社员登录</h2>

        <form method="POST">
            <input name="username" placeholder="用户名 / QQ号 / 邮箱" required
                   type="text" value="{{ username }}" class="u-03cdc0d1">
            <input name="password" placeholder="密码" required
                   type="password" class="u-5fe3d7d7">
            <button class="btn-primary u-6313cb4c" type="submit">登录</button>
        </form>

        <p class="u-fb0319b6">
            还没有账号？<a href="{{ url_for('auth.register') }}" class="u-098aa70b">注册</a>
        </p>
        <p class="u-7ee5d43b">
            <a href="{{ url_for('auth.forgot_password') }}" class="u-bf4b6787">忘记密码？</a>
        </p>
    </div>

</div>

{% endblock %}
