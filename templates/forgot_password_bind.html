<!-- forgot_password_bind.html -->
{% extends "base.html" %}
{% block title %}绑定邮箱{% endblock %}
{% block content %}

<div class="u-0079990c">

    <div class="u-ea57f62b">
        <h2 class="u-83413b95">绑定邮箱</h2>
        <p class="u-0693f39e">该账号尚未绑定邮箱，请先绑定以便修改密码</p>

        <form method="POST" action="{{ url_for('auth.forgot_bind_send_code') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <input type="email" name="email" placeholder="你的QQ邮箱" required class="u-79423dd2">
            <button type="submit" class="u-ee81c54f">发送验证码</button>
        </form>

        <form method="POST" action="{{ url_for('auth.forgot_bind_verify') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="text" name="code" placeholder="6位验证码" required class="u-4044812b">
            <button type="submit" class="u-84e214c9">确认绑定</button>
        </form>

        <p class="u-efbce96b">
            <a href="{{ url_for('auth.login') }}" class="u-bf4b6787">← 返回登录</a>
        </p>
    </div>

</div>

{% endblock %}
