<!-- forgot_password_bind.html -->
{% extends "base.html" %}
{% block title %}绑定邮箱{% endblock %}
{% block content %}

<div style="max-width:420px; margin:0 auto; padding:20px 0;">

    <div style="background: var(--bg-card); padding:32px 28px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); border:1px solid var(--border-color);">
        <h2 style="margin-top:0; margin-bottom:8px; text-align:center; color: var(--text-primary);">绑定邮箱</h2>
        <p style="color: var(--text-secondary); text-align:center; margin-bottom:24px; font-size:14px;">该账号尚未绑定邮箱，请先绑定以便修改密码</p>

        <form method="POST" action="{{ url_for('auth.forgot_bind_send_code') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <input type="email" name="email" placeholder="你的QQ邮箱" required
                   style="flex:1; padding:12px; border:1px solid var(--border-color); border-radius:8px; min-width:180px; font-size:16px; box-sizing:border-box; background: var(--bg-input); color: var(--text-primary);">
            <button type="submit" style="padding:12px 18px; background:#1e2a3a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap;">发送验证码</button>
        </form>

        <form method="POST" action="{{ url_for('auth.forgot_bind_verify') }}" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="text" name="code" placeholder="6位验证码" required
                   style="flex:1; padding:12px; border:1px solid var(--border-color); border-radius:8px; min-width:120px; font-size:16px; box-sizing:border-box; background: var(--bg-input); color: var(--text-primary);">
            <button type="submit" style="padding:12px 18px; background:#f39c12; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap;">确认绑定</button>
        </form>

        <p style="margin-top:16px; text-align:center; font-size:14px;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--text-muted);">← 返回登录</a>
        </p>
    </div>

</div>

{% endblock %}
