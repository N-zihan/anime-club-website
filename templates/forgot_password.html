<!-- forgot_password.html -->
{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="u-0079990c">

    <div class="u-ea57f62b">
        <h2 class="u-83413b95">修改密码</h2>
        <p class="u-0693f39e">输入你注册时填写的QQ号，重置链接将发至绑定的邮箱</p>

        <form method="POST">
            <input type="text" name="qq" placeholder="请输入你的QQ号" required class="u-5fe3d7d7">
            <button type="submit" class="btn-primary u-6313cb4c">发送重置链接</button>
        </form>

        <p class="u-efbce96b">
            <a href="{{ url_for('auth.login') }}" class="u-bf4b6787">← 返回登录</a>
        </p>
    </div>

</div>

{% endblock %}
