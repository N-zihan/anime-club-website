{% extends "base.html" %}
{% block title %}网络开小差了{% endblock %}

{% block content %}
<div class="offline-wrap">
    <picture>
        <source srcset="{{ url_for('static', filename='images/kanban-480.webp') }}" type="image/webp">
        <img class="offline-img" src="{{ url_for('static', filename='images/kanban-480.png') }}"
             alt="看板娘" width="160" height="160" loading="lazy" decoding="async">
    </picture>
    <h2 class="offline-title">网络开小差了…</h2>
    <p class="offline-desc">
        看起来你现在没有网络（或者信号不太行）。<br>
        已经缓存的页面和图片还能看，其他内容等网络回来再试吧。
    </p>
    <div class="offline-actions">
        <button type="button" class="btn btn-primary" onclick="location.reload()">重新加载</button>
        <a class="btn btn-ghost" href="{{ url_for('public.splash') }}">回到首页</a>
    </div>
    <p class="offline-tip">小提示：把本站「添加到主屏幕」，断网时也能快速打开～</p>
</div>
{% endblock %}
