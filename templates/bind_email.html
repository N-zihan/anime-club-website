{% extends "base.html" %}
{% block title %}绑定邮箱{% endblock %}
{% block content %}

<div class="u-b743492a">

    <div class="u-ea57f62b">
        <h2 class="u-83413b95">绑定邮箱</h2>

        {% if user.email %}
        <div class="u-4f23706f">
            <p class="u-8918ff64">当前已绑定</p>
            <p class="u-66d24fe1">{{ user.email }}</p>
        </div>
        {% endif %}

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
            <input type="email" id="bindEmailInput" placeholder="请输入你的邮箱" required class="u-03f06e8c">
            <button type="button" id="sendEmailCodeBtn" class="u-ee81c54f">
                发送验证码
            </button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
            <input type="text" id="bindEmailCode" placeholder="6位验证码" required class="u-1d93019d">
            <button type="button" id="verifyEmailCodeBtn" class="u-84e214c9">
                确认绑定
            </button>
        </div>

        <div id="emailBindMessage" class="u-41d59dc9"></div>

        <p class="u-efbce96b">
            <a href="{{ url_for('user.profile') }}" class="u-bf4b6787">← 返回个人设置</a>
        </p>
    </div>

</div>

<script>
(function() {
    const sendBtn = document.getElementById('sendEmailCodeBtn');
    const verifyBtn = document.getElementById('verifyEmailCodeBtn');
    const emailInput = document.getElementById('bindEmailInput');
    const codeInput = document.getElementById('bindEmailCode');
    const msgDiv = document.getElementById('emailBindMessage');
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    let countdown = 0;

    function showMsg(text, type) {
        msgDiv.textContent = text;
        msgDiv.style.color = type === 'success' ? '#16a34a' : '#dc2626';
    }

    // 发送验证码
    sendBtn.addEventListener('click', function() {
        const email = emailInput.value.trim();
        if (!email) { showMsg('请先填写邮箱', 'error'); return; }
        if (countdown > 0) return;

        sendBtn.disabled = true;
        sendBtn.textContent = '发送中...';

        fetch('/bind_email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: 'action=send_email_code&email=' + encodeURIComponent(email)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                showMsg(data.error, 'error');
                sendBtn.disabled = false;
                sendBtn.textContent = '发送验证码';
                return;
            }
            showMsg(data.message, 'success');
            countdown = 60;
            const timer = setInterval(() => {
                countdown--;
                sendBtn.textContent = countdown + 's';
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '重新发送';
                }
            }, 1000);
        })
        .catch(() => {
            showMsg('网络错误，请重试', 'error');
            sendBtn.disabled = false;
            sendBtn.textContent = '发送验证码';
        });
    });

    // 确认绑定
    verifyBtn.addEventListener('click', function() {
        const code = codeInput.value.trim();
        if (!code) { showMsg('请填写验证码', 'error'); return; }

        verifyBtn.disabled = true;
        verifyBtn.textContent = '验证中...';

        fetch('/bind_email', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: 'action=verify_email_code&code=' + encodeURIComponent(code)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                showMsg(data.error, 'error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = '确认绑定';
                return;
            }
            showMsg(data.message + '，3 秒后返回...', 'success');
            setTimeout(() => {
                window.location.href = "{{ url_for('user.profile') }}";
            }, 1500);
        })
        .catch(() => {
            showMsg('网络错误，请重试', 'error');
            verifyBtn.disabled = false;
            verifyBtn.textContent = '确认绑定';
        });
    });
})();
</script>

{% endblock %}
