{% extends "base.html" %}
{% block title %}赛事管理{% endblock %}
{% block content %}
<div class="admin-header">
    <h2>赛事管理</h2>
    <a class="btn-add" href="{{ url_for('admin.admin_contest_create') }}">创建赛事</a>
</div>

{% if contests %}
<table class="admin-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>标题</th>
        <th>状态</th>
        <th>创建时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    {% for c in contests %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.title }}</td>
        <td>{{ c.status }}</td>
        <td>{{ c.created_at.strftime('%Y-%m-%d') }}</td>
        <td>
            <a class="btn-edit" href="{{ url_for('admin.admin_contest_edit', contest_id=c.id) }}">编辑</a>
            <form method="POST" action="{{ url_for('admin.admin_contest_delete', contest_id=c.id) }}"
                  style="display:inline;"
                  onsubmit="return confirm('确定删除？')">
                <button type="submit" class="btn-delete">删除</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p class="u-e1978eed">暂无赛事</p>
{% endif %}
{% endblock %}
