{% extends "base.html" %}
{% block title %}设置头像{% endblock %}
{% block content %}

<div class="u-00a283f6">

    <div class="u-ea57f62b">

        <h2 class="u-8edc1dc1">欢迎，{{ user.username }}</h2>
        <p class="u-5dfb6328">给头像上传一张图片吧</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="u-79a1c5a5">
                <input type="file" name="avatar" accept="image/*" required data-compress-upload class="u-8705ee94">
                <small class="compress-hint" style="display:none; color: var(--text-muted); display:block; margin-top:6px;"></small>
            </div>
            <button type="submit" class="btn-primary u-6313cb4c">
                上传头像
            </button>
        </form>

        <small style="color: var(--text-muted); display:block; margin-top:10px;">支持 png / jpg / gif</small>

        <form method="POST" class="u-9eb125f5">
            <input type="hidden" name="action" value="skip">
            <button type="submit" class="u-34623e39">
                稍后再说
            </button>
        </form>

    </div>

</div>

{% endblock %}
