{% extends "base.html" %}
{% block title %}番剧百科{% endblock %}
{% block content %}

<h2>番剧百科</h2>
<p class="u-3e1f07e8">
    数据来源：Bangumi 番组计划
</p>

<!-- 搜索栏 + 排序 -->
<div style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
    <input type="text" id="searchInput" placeholder="搜索番剧..."
           autocomplete="off" class="u-94d47cc4">
    <button type="button" id="searchBtn" class="u-6f5de2ed">
        搜索
    </button>
    <button type="button" id="clearBtn"
            style="display:none; padding:10px 20px; background: var(--bg-code); color: var(--text-primary); border:1px solid var(--border-color); border-radius:24px; cursor:pointer; font-size:0.9rem;">
        返回
    </button>
    <select id="sortSelect" class="u-646d1d38">
        <option value="rank">按排名</option>
        <option value="heat">按热度</option>
        <option value="score">按评分</option>
        <option value="date">按发售日期</option>
    </select>
</div>

<div id="status" style="text-align:center; color: var(--text-muted); padding:20px 0; display:none;"></div>

<div id="animeGrid"
     style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px;">
</div>

<div id="loadMore"
     style="text-align:center; padding:30px 0; color: var(--text-muted); font-size:0.9rem; display:none;">
    正在加载...
</div>

<div id="theEnd"
     style="text-align:center; padding:30px 0; color: var(--text-muted); font-size:0.85rem; display:none;">
    — 没有更多了 —
</div>

<!-- 番剧详情模态框 -->
<div id="animeModal"
     style="display:none; position:fixed; inset:0; background:rgba(8,16,30,0.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:99999; align-items:center; justify-content:center; padding:24px 16px; overflow:hidden;"
     onclick="if(event.target===this) closeAnimeModal()">
    <div class="u-96f9f86a">
        <button onclick="closeAnimeModal()" class="u-60e748b7">×</button>
        <div id="modalContent"></div>
    </div>
</div>
<!-- 角色详情模态框 -->
<div id="characterModal"
     style="display:none; position:fixed; inset:0; background:rgba(8,16,30,0.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:100000; align-items:center; justify-content:center; padding:24px 16px; overflow:hidden;"
     onclick="if(event.target===this) closeCharacterModal()">
    <div class="u-399e3c8b">
        <button onclick="closeCharacterModal()" class="u-60e748b7">×</button>
        <div id="characterModalContent"></div>
    </div>
</div>

<script>
(function () {
    const grid = document.getElementById('animeGrid');
    const statusEl = document.getElementById('status');
    const loadMoreEl = document.getElementById('loadMore');
    const theEndEl = document.getElementById('theEnd');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const sortSelect = document.getElementById('sortSelect');

    let offset = 0;
    let keyword = '';
    let sort = 'rank';
    let loading = false;
    let hasMore = true;

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function cardHtml(a) {
        const coverSrc = a.cover
            ? '/api/anime/cover?url=' + encodeURIComponent(a.cover)
            : '';
        const cover = coverSrc
            ? '<img src="' + coverSrc + '" alt="' + escapeHtml(a.name) + '" loading="lazy" ' +
              'style="width:100%; height:260px; object-fit:cover; display:block; background: var(--bg-code);">'
            : '<div style="width:100%; height:260px; background: var(--bg-code);"></div>';
        const score = a.score
            ? '<span style="color:#f39c12; font-weight:600;">★ ' + a.score + '</span>'
            : '<span style="color: var(--text-muted);">暂无评分</span>';
        const rank = a.rank
            ? '<div style="font-size:0.75rem; color: var(--text-muted); margin-top:4px;">Bangumi 排名 #' + a.rank + '</div>'
            : '';
        const original = (a.original_name && a.original_name !== a.name)
            ? '<div style="font-size:0.75rem; color: var(--text-muted); margin-bottom:6px;">' + escapeHtml(a.original_name) + '</div>'
            : '';

        return '<div onclick="openAnimeModal(' + a.id + ')" ' +
               'style="cursor:pointer; background: var(--bg-card); border:1px solid var(--border-color); border-radius:12px; overflow:hidden; transition: transform 0.15s, box-shadow 0.2s;" ' +
               'onmouseover="this.style.transform=\'translateY(-3px)\'; this.style.boxShadow=\'0 8px 20px rgba(0,0,0,0.1)\';" ' +
               'onmouseout="this.style.transform=\'\'; this.style.boxShadow=\'\';">' +
            cover +
            '<div style="padding:12px 14px;">' +
                '<div style="font-weight:600; color: var(--text-primary); margin-bottom:4px; line-height:1.4;">' + escapeHtml(a.name) + '</div>' +
                original +
                '<div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; margin-top:8px;">' +
                    score +
                    '<span style="color: var(--text-muted);">' + escapeHtml(a.date) + '</span>' +
                '</div>' +
                rank +
                '<div class="anime-status-actions" onclick="event.stopPropagation();">' +
                    '<button type="button" class="anime-status-btn" data-status="want" ' +
                        'onclick="addAnimeToList(event, this)">想看</button>' +
                    '<button type="button" class="anime-status-btn" data-status="watching" ' +
                        'onclick="addAnimeToList(event, this)">在看</button>' +
                    '<button type="button" class="anime-status-btn" data-status="done" ' +
                        'onclick="addAnimeToList(event, this)">看过</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    // 把番剧加入追番清单（重名会更新状态，不会重复插入）
    function addAnimeToList(event, btn) {
        event.preventDefault();
        event.stopPropagation();
        var card = btn.closest('[onclick^="openAnimeModal"]');
        var animeId = card ? card.getAttribute('onclick').match(/\d+/)[0] : null;
        if (!animeId) return;
        var cache = window.__animeCache || {};
        var anime = cache[animeId] || {};
        var csrfEl = document.querySelector('input[name="csrf_token"]');
        var csrf = csrfEl ? csrfEl.value : '';

        fetch('/api/anime_list', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
            body: JSON.stringify({
                bangumi_id: parseInt(animeId, 10),
                title: anime.name || '',
                image: anime.cover || '',
                status: btn.dataset.status || 'want'
            })
        }).then(function (r) { return r.json(); }).then(function (data) {
            if (!data.ok) throw new Error(data.error || '加入失败');
            var labels = {want: '想看', watching: '在看', done: '看过'};
            btn.parentElement.querySelectorAll('.anime-status-btn').forEach(function (b) {
                b.classList.toggle('is-active', b === btn);
            });
            showAnimeToast('已标记为「' + (labels[data.status] || data.status) + '」');
        }).catch(function (err) {
            showAnimeToast(err.message || '加入失败，请先登录');
        });
    }

    var animeToastTimer = null;
    function showAnimeToast(text) {
        var el = document.getElementById('animeToast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'animeToast';
            el.className = 'toast-mini';
            document.body.appendChild(el);
        }
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(animeToastTimer);
        animeToastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }

    function appendItems(items) {
        items.forEach(function (a) {
            grid.insertAdjacentHTML('beforeend', cardHtml(a));
        });
    }

    function loadPage() {
        if (loading || !hasMore) return;
        loading = true;
        loadMoreEl.style.display = 'block';
        loadMoreEl.textContent = '正在加载...';

        let url;
        if (keyword) {
            url = '/api/anime/search?q=' + encodeURIComponent(keyword)
                + '&offset=' + offset
                + '&sort=' + encodeURIComponent(sort);
        } else {
            url = '/api/anime/list?offset=' + offset + '&sort=' + encodeURIComponent(sort);
        }

        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                const items = data.items || [];
                appendItems(items);
                offset += items.length;

                if (items.length < 25) {
                    hasMore = false;
                    loadMoreEl.style.display = 'none';
                    if (offset > 0) theEndEl.style.display = 'block';
                } else {
                    loadMoreEl.style.display = 'none';
                }
            })
            .catch(function () {
                loadMoreEl.textContent = '加载失败，请稍后重试';
            })
            .finally(function () {
                loading = false;
            });
    }

    function resetAndLoad() {
        offset = 0;
        hasMore = true;
        loading = false;
        grid.innerHTML = '';
        theEndEl.style.display = 'none';
        statusEl.style.display = 'none';
        loadPage();
    }

    // 滚动监听
    window.addEventListener('scroll', function () {
        if (loading || !hasMore) return;
        const scrollBottom = window.innerHeight + window.scrollY;
        if (scrollBottom < document.body.offsetHeight - 300) return;
        loadPage();
    });

    // 搜索
    searchBtn.addEventListener('click', function () {
        const q = searchInput.value.trim();
        if (!q) return;
        keyword = q;
        clearBtn.style.display = 'inline-block';
        resetAndLoad();
    });

    searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            searchBtn.click();
        }
    });

    clearBtn.addEventListener('click', function () {
        keyword = '';
        searchInput.value = '';
        clearBtn.style.display = 'none';
        resetAndLoad();
    });

    sortSelect.addEventListener('change', function () {
        sort = this.value;
        resetAndLoad();
    });

    // ===== 番剧详情模态框：限制高度 85vh + 内部滚动；打开锁滚动，关闭必须解锁 =====
    let savedBodyOverflow = '';

    async function openAnimeModal(id) {
        const modal = document.getElementById('animeModal');
        const content = document.getElementById('modalContent');

        // 记录当前滚动状态，并锁住页面滚动（避免弹窗内滚动带动整页）
        savedBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';

        content.innerHTML = '<div style="text-align:center; padding:40px 0; color: var(--text-muted);">正在加载...</div>';
        modal.style.display = 'flex';

        let d;
        try {
            const res = await fetch('/api/anime/detail/' + id);
            if (!res.ok) throw new Error('not found');
            d = await res.json();
        } catch (e) {
            content.innerHTML = '<div style="text-align:center; padding:60px 0; color: var(--text-muted);">加载失败，请稍后重试</div>';
            return;
        }

        const coverSrc = d.cover
            ? '/api/anime/cover?url=' + encodeURIComponent(d.cover)
            : '';
        const coverHtml = coverSrc
            ? '<img src="' + coverSrc + '" alt="' + escapeHtml(d.name) + '" ' +
              'style="width:200px; height:280px; object-fit:cover; border-radius:12px; flex-shrink:0; background: var(--bg-code);" loading="lazy" decoding="async">'
            : '<div style="width:200px; height:280px; background: var(--bg-code); border-radius:12px; flex-shrink:0;"></div>';

        const scoreHtml = d.score
            ? '<div style="font-size:1.6rem; color:#f39c12; font-weight:700; line-height:1;">★ ' + d.score + '</div>' +
              (d.total ? '<div style="font-size:0.75rem; color: var(--text-muted); margin-top:2px;">' + d.total + ' 人评分</div>' : '')
            : '<div style="color: var(--text-muted);">暂无评分</div>';

        const meta = [];
        if (d.rank) meta.push('排名 #' + d.rank);
        if (d.eps) meta.push(d.eps + ' 集');
        if (d.date) meta.push(d.date);
        if (d.platform) meta.push(d.platform);
        const metaHtml = meta.length
            ? '<div style="font-size:0.85rem; color: var(--text-secondary); margin-top:12px; line-height:1.7;">' + meta.join(' · ') + '</div>'
            : '';

        const staffHtml = d.staff && d.staff.length
            ? '<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">' +
              '<div style="font-size:0.8rem; color: var(--text-muted); margin-bottom:8px;">制作阵容</div>' +
              d.staff.map(function (s) {
                  return '<div style="font-size:0.85rem; line-height:1.8; color: var(--text-primary);">' +
                      '<span style="color: var(--text-muted); display:inline-block; min-width:80px;">' + escapeHtml(s.key) + '</span>' +
                      escapeHtml(s.value) +
                  '</div>';
              }).join('') +
              '</div>'
            : '';

        const summaryHtml = d.summary
            ? '<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">' +
              '<div style="font-size:0.8rem; color: var(--text-muted); margin-bottom:8px;">简介</div>' +
              '<div style="color: var(--text-primary); font-size:0.9rem; line-height:1.8; white-space:pre-wrap;">' + escapeHtml(d.summary) + '</div>' +
              '</div>'
            : '';

        // 主要角色区域（初始只有按钮）
        const charactersHtml =
            '<div id="charactersSection" style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
                '<div style="font-size:0.8rem; color: var(--text-muted);">主要角色</div>' +
                '<button id="loadCharactersBtn" style="padding:4px 14px; background:var(--bg-code); border:1px solid var(--border-color); border-radius:20px; color:var(--text-secondary); font-size:0.8rem; cursor:pointer;">查看角色 →</button>' +
            '</div>' +
            '<div id="charactersList" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;"></div>' +
            '</div>';

        const html =
            '<div style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">' +
                coverHtml +
                '<div style="flex:1; min-width:220px;">' +
                    '<h2 style="margin:0 0 6px 0; color: var(--text-primary); font-size:1.3rem; line-height:1.3;">' + escapeHtml(d.name) + '</h2>' +
                    (d.original_name && d.original_name !== d.name
                        ? '<div style="color: var(--text-muted); font-size:0.85rem; margin-bottom:14px;">' + escapeHtml(d.original_name) + '</div>'
                        : '') +
                    scoreHtml +
                    metaHtml +
                '</div>' +
            '</div>' +
            staffHtml +
            summaryHtml +
            charactersHtml +
            '<div style="margin-top:22px; text-align:right;">' +
                '<a href="https://search.bilibili.com/all?keyword=' + encodeURIComponent(d.name) + '" target="_blank" rel="noopener" ' +
                   'style="display:inline-block; padding:10px 24px; background:#00a1d6; color:#fff; text-decoration:none; border-radius:24px; font-size:0.9rem;">' +
                   '去 B 站找这部番 →' +
                '</a>' +
            '</div>';

        content.innerHTML = html;

        // 用户点"查看角色"才加载
        const loadBtn = document.getElementById('loadCharactersBtn');
        if (loadBtn) {
            loadBtn.addEventListener('click', function () {
                this.style.display = 'none';
                const listEl = document.getElementById('charactersList');
                listEl.innerHTML = '<span style="color: var(--text-muted); font-size:0.85rem;">加载中...</span>';

                fetch('/api/anime/characters/' + id)
                    .then(r => r.json())
                    .then(data => {
                        const chars = data.characters || [];
                        if (!chars.length) {
                            listEl.innerHTML = '<span style="color: var(--text-muted); font-size:0.85rem;">暂无角色信息</span>';
                            return;
                        }

                        const PAGE_SIZE = 10;
                        let loaded = 0;

                        function charHtml(c) {
                            const imgSrc = c.image ? '/api/anime/cover?url=' + encodeURIComponent(c.image) : '';
                            const img = imgSrc
                                ? '<img src="' + imgSrc + '" alt="' + escapeHtml(c.name) + '" loading="lazy" ' +
                                  'style="width:70px; height:70px; object-fit:cover; border-radius:8px; display:block; background: var(--bg-code);">'
                                : '<div style="width:70px; height:70px; background: var(--bg-code); border-radius:8px;"></div>';
                            const cv = c.cv ? '<div style="font-size:0.7rem; color: var(--text-muted); margin-top:2px;">CV: ' + escapeHtml(c.cv) + '</div>' : '';
                            return '<div onclick="openCharacterModal(' + c.id + ')" ' +
                                   'style="cursor:pointer; flex-shrink:0; width:80px; text-align:center; transition: transform 0.15s;" ' +
                                   'onmouseover="this.style.transform=\'translateY(-2px)\';" ' +
                                   'onmouseout="this.style.transform=\'\';">' +
                                img +
                                '<div style="font-size:0.8rem; color: var(--text-primary); margin-top:6px; line-height:1.3;">' + escapeHtml(c.name) + '</div>' +
                                cv +
                            '</div>';
                        }

                        function loadMoreChars() {
                            const next = chars.slice(loaded, loaded + PAGE_SIZE);
                            if (!next.length) return;
                            listEl.insertAdjacentHTML('beforeend', next.map(charHtml).join(''));
                            loaded += next.length;
                            let spinner = listEl.querySelector('.char-loading');
                            const hasMoreChars = loaded < chars.length;
                            if (hasMoreChars && !spinner) {
                                listEl.insertAdjacentHTML('beforeend',
                                    '<div class="char-loading" style="flex-shrink:0; width:80px; display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size:0.8rem;">加载中...</div>');
                            } else if (!hasMoreChars && spinner) {
                                spinner.remove();
                            }
                        }

                        listEl.innerHTML = '';
                        loadMoreChars();
                        listEl.onscroll = function () {
                            const nearEnd = listEl.scrollLeft + listEl.clientWidth >= listEl.scrollWidth - 40;
                            if (nearEnd && loaded < chars.length) loadMoreChars();
                        };
                    })
                    .catch(() => {
                        listEl.innerHTML = '<span style="color: var(--text-muted); font-size:0.85rem;">加载失败</span>';
                    });
            });
        }
    }

    function closeAnimeModal() {
        const modal = document.getElementById('animeModal');
        if (modal) {
            modal.style.display = 'none';
        }
        // 关闭时必须释放页面滚动锁
        document.body.style.overflow = savedBodyOverflow || '';
    }

    // ===== 角色详情模态框：限制高度 80vh + 内部滚动 =====
    async function openCharacterModal(charId) {
        const modal = document.getElementById('characterModal');
        const content = document.getElementById('characterModalContent');

        // 角色弹窗叠加在番剧弹窗之上，页面滚动锁由番剧弹窗统一持有
        content.innerHTML = '<div style="text-align:center; padding:40px 0; color: var(--text-muted);">正在加载...</div>';
        modal.style.display = 'flex';

        let d;
        try {
            const res = await fetch('/api/anime/character/' + charId);
            if (!res.ok) throw new Error('not found');
            d = await res.json();
        } catch (e) {
            content.innerHTML = '<div style="text-align:center; padding:60px 0; color: var(--text-muted);">加载失败，请稍后重试</div>';
            return;
        }

        const coverSrc = d.image ? '/api/anime/cover?url=' + encodeURIComponent(d.image) : '';
        const coverHtml = coverSrc
            ? '<img src="' + coverSrc + '" alt="' + escapeHtml(d.name) + '" ' +
              'style="width:140px; height:200px; object-fit:cover; border-radius:12px; flex-shrink:0; background: var(--bg-code);" loading="lazy" decoding="async">'
            : '<div style="width:140px; height:200px; background: var(--bg-code); border-radius:12px; flex-shrink:0;"></div>';

        const meta = [];
        if (d.gender) meta.push(d.gender === 'male' ? '男' : d.gender === 'female' ? '女' : d.gender);
        if (d.birthday) meta.push('生日 ' + d.birthday);
        if (d.blood_type) meta.push('血型 ' + d.blood_type);
        if (d.height) meta.push('身高 ' + d.height + 'cm');
        if (d.weight) meta.push('体重 ' + d.weight + 'kg');
        const metaHtml = meta.length
            ? '<div style="font-size:0.85rem; color: var(--text-secondary); margin-top:10px; line-height:1.8;">' + meta.join(' · ') + '</div>'
            : '';

        const cvHtml = d.cv
            ? '<div style="font-size:0.85rem; color: var(--text-secondary); margin-top:6px;">声优：' + escapeHtml(d.cv) + '</div>'
            : '';

        const summaryHtml = d.summary
            ? '<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">' +
              '<div style="font-size:0.8rem; color: var(--text-muted); margin-bottom:8px;">简介</div>' +
              '<div style="color: var(--text-primary); font-size:0.9rem; line-height:1.8; white-space:pre-wrap;">' + escapeHtml(d.summary) + '</div>' +
              '</div>'
            : '';

        const html =
            '<div style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">' +
                coverHtml +
                '<div style="flex:1; min-width:180px;">' +
                    '<h2 style="margin:0 0 6px 0; color: var(--text-primary); font-size:1.3rem; line-height:1.3;">' + escapeHtml(d.name) + '</h2>' +
                    (d.original_name && d.original_name !== d.name
                        ? '<div style="color: var(--text-muted); font-size:0.85rem; margin-bottom:6px;">' + escapeHtml(d.original_name) + '</div>'
                        : '') +
                    metaHtml +
                    cvHtml +
                '</div>' +
            '</div>' +
            summaryHtml;

        content.innerHTML = html;
    }

    function closeCharacterModal() {
        const modal = document.getElementById('characterModal');
        if (modal) modal.style.display = 'none';
        // 页面滚动锁仍由番剧弹窗持有，这里不释放
    }

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            const charModal = document.getElementById('characterModal');
            if (charModal && charModal.style.display === 'flex') {
                closeCharacterModal();
                return;
            }
            closeAnimeModal();
        }
    });

    window.openAnimeModal = openAnimeModal;
    window.closeAnimeModal = closeAnimeModal;
    window.openCharacterModal = openCharacterModal;
    window.closeCharacterModal = closeCharacterModal;

    // 首次加载
    loadPage();
})();
</script>

{% endblock %}
