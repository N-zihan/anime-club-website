{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}

<div class="u-0079990c">

    <div class="u-ea57f62b">
        <h2 class="u-3396091c">社团成员注册</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="用户名（2-20位中文/字母/数字）" required class="u-03cdc0d1">
            <input type="text" name="qq" placeholder="QQ号（5-12位数字）" required class="u-03cdc0d1">
            <input type="email" id="registerEmail" name="email" placeholder="QQ邮箱（用于修改密码）" required class="u-03cdc0d1">
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" name="code" placeholder="6位验证码" required class="u-2de7cd02">
                <button type="button" id="sendCodeBtn" onclick="sendCode()" class="u-cb93edd2">
                    获取验证码
                </button>
            </div>
            <small style="color: var(--text-muted); display:block; margin-bottom:12px; font-size:13px;">验证码将发送至你的邮箱</small>
            <input type="text" name="group" placeholder="社团验证码（QQ群号）" required class="u-03cdc0d1">
            <input type="password" name="password" placeholder="密码（至少6位）" required class="u-03cdc0d1">
            <input type="password" name="confirm_password" placeholder="请再次输入密码" required class="u-5fe3d7d7">
            <button type="submit" class="btn-primary u-6313cb4c">注册</button>
        </form>

        <p class="u-fb0319b6">
            已有账号？<a href="{{ url_for('auth.login') }}" class="u-098aa70b">登录</a>
        </p>
    </div>

</div>

<script>
let countdown = 0;
function sendCode() {
    const email = document.getElementById('registerEmail').value;
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    if (!email) { alert('请先填写邮箱'); return; }
    if (countdown > 0) return;
    fetch('/send_register_code', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: 'email=' + encodeURIComponent(email)
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        alert('验证码已发送，请查收');
        countdown = 60;
        const btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;
        const timer = setInterval(() => {
            countdown--;
            btn.textContent = countdown + 's';
            if (countdown <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '重新发送';
            }
        }, 1000);
    });
}
</script>

{% endblock %}
