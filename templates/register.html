{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}

<div style="max-width:420px; margin:0 auto; padding:20px 0;">

    <div style="background: var(--bg-card); padding:32px 28px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); border:1px solid var(--border-color);">
        <h2 style="margin-top:0; margin-bottom:24px; text-align:center; color: var(--text-primary);">社团成员注册</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="用户名（2-20位中文/字母/数字）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <input type="text" name="qq" placeholder="QQ号（5-12位数字）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <input type="email" id="registerEmail" name="email" placeholder="QQ邮箱（用于修改密码）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" name="code" placeholder="6位验证码" required
                       style="flex:1; padding:12px; border:1px solid var(--border-color); border-radius:8px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
                <button type="button" id="sendCodeBtn" onclick="sendCode()"
                        style="padding:0 18px; background:#1e2a3a; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap;">
                    获取验证码
                </button>
            </div>
            <small style="color: var(--text-muted); display:block; margin-bottom:12px; font-size:13px;">验证码将发送至你的邮箱</small>
            <input type="text" name="group" placeholder="社团验证码（QQ群号）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <input type="password" name="password" placeholder="密码（至少6位）" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:12px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <input type="password" name="confirm_password" placeholder="请再次输入密码" required
                   style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:8px; margin-bottom:16px; box-sizing:border-box; font-size:16px; background: var(--bg-input); color: var(--text-primary);">
            <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:16px; border:none; border-radius:8px; cursor:pointer;">注册</button>
        </form>

        <p style="margin-top:16px; text-align:center; font-size:14px; color: var(--text-secondary);">
            已有账号？<a href="{{ url_for('auth.login') }}" style="color: var(--text-primary); font-weight:600;">登录</a>
        </p>
    </div>

</div>

<script>
let countdown = 0;
function sendCode() {
    const email = document.getElementById('registerEmail').value;
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    if (!email) { alert('请先填写邮箱'); return; }
    if (countdown > 0) return;
    fetch('/send_register_code', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: 'email=' + encodeURIComponent(email)
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) { alert(data.error); return; }
        alert('验证码已发送，请查收');
        countdown = 60;
        const btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;
        const timer = setInterval(() => {
            countdown--;
            btn.textContent = countdown + 's';
            if (countdown <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '重新发送';
            }
        }, 1000);
    });
}
</script>

{% endblock %}
