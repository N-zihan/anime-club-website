{% extends "base.html" %}
{% block title %}管理照片墙{% endblock %}
{% block content %}
<h2>照片墙管理</h2>

<h3>上传新照片</h3>
<form action="{{ url_for('admin.admin_gallery_upload') }}" enctype="multipart/form-data" method="POST"
      id="galleryUploadForm">
    <input accept="image/*" name="file" required type="file">
    <select name="activity_id">
        <option value="">往期活动照片</option>
        {% for act in activities %}
        <option value="{{ act.id }}">{{ act.title }}（{{ act.date }}）</option>
        {% endfor %}
    </select>
    <button type="submit" id="galleryUploadBtn" class="btn-primary">上传</button>
</form>
<script>
    document.getElementById('galleryUploadForm').addEventListener('submit', function () {
        var btn = document.getElementById('galleryUploadBtn');
        if (btn) { btn.disabled = true; btn.textContent = '上传中...'; }
    });
</script>

<h3>现有照片</h3>
<div class="gallery-grid">
    {% for photo in photos %}
    <div class="gallery-item">
        <img alt="{{ photo.filename }}" src="{{ photo.url }}">
        <div class="u-44cd1236">
            <span class="u-6a5470f6">
                {% if photo.activity %}{{ photo.activity.title }}{% else %}往期活动{% endif %}
            </span>
            <form method="POST" action="{{ url_for('admin.admin_gallery_delete', photo_id=photo.id) }}"
                  style="display:inline; margin-left:10px;"
                  onsubmit="return confirm('确定删除？');">
                <button type="submit" class="u-7898ea22">删除</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
<a href="{{ url_for('admin.admin_activities') }}">返回活动管理</a>
{% endblock %}
