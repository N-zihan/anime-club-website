{% extends "base.html" %}
{% block title %}番剧新闻{% endblock %}
{% block content %}

<h2>番剧新闻</h2>
<p style="color: var(--text-secondary); font-size:0.9rem; margin-bottom:16px;">
    数据来源：ANN / MAL / Crunchyroll / Comic Book 等多家媒体
</p>

<!-- 搜索框（搜索历史面板锚点由下方 task-9 脚本按需插入，避免与并行改动冲突） -->
<div id="newsSearchRow" style="display:flex; gap:8px; margin-bottom:16px;">
    <input type="text" id="newsSearchInput" placeholder="搜索新闻（支持中文，如：药屋、海贼王）"
           autocomplete="off"
           style="flex:1; padding:10px 16px; border:1px solid var(--border-color); border-radius:24px; font-size:0.95rem; background: var(--bg-input); color: var(--text-primary);">
    <button type="button" id="newsSearchBtn"
            style="padding:10px 20px; background:#1e2a3a; color:#fff; border:none; border-radius:24px; cursor:pointer; font-size:0.9rem;">搜索</button>
    <button type="button" id="newsClearBtn"
            style="display:none; padding:10px 20px; background: var(--bg-code); color: var(--text-primary); border:1px solid var(--border-color); border-radius:24px; cursor:pointer; font-size:0.9rem;">返回</button>
</div>

<!-- 标签筛选 -->
<div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
    <button class="filter-btn" data-tag=""
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:#1e2a3a; color:white; cursor:pointer; font-size:0.85rem;">全部</button>
    <button class="filter-btn" data-tag="anime"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">动画</button>
    <button class="filter-btn" data-tag="manga"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">漫画</button>
    <button class="filter-btn" data-tag="industry"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">业界</button>
    <button class="filter-btn" data-tag="official"
            style="padding:6px 16px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.85rem;">官方</button>
</div>

<!-- 显示语言（与「设置 → 语言与翻译」共用本地偏好，无需登录） -->
<div id="newsLangRow" style="display:flex; align-items:center; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
    <span style="font-size:0.82rem; color: var(--text-muted);">显示：</span>
    <button type="button" class="news-lang-btn" data-lang="zh"
            style="padding:6px 14px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.82rem;">译文优先</button>
    <button type="button" class="news-lang-btn" data-lang="original"
            style="padding:6px 14px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.82rem;">仅原文</button>
    <button type="button" class="news-lang-btn" data-lang="both"
            style="padding:6px 14px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-code); color:var(--text-primary); cursor:pointer; font-size:0.82rem;">双语对照</button>
</div>

<div id="newsStatus" style="text-align:center; color: var(--text-muted); padding:40px 0; display:none;"></div>
<div id="newsFeed"></div>

<button id="loadMoreBtn" style="display:none; width:100%; padding:14px; margin-top:20px; background:var(--bg-code); border:1px solid var(--border-color); border-radius:12px; cursor:pointer; color:var(--text-primary); font-size:0.9rem;">加载更多</button>

<style>
.news-item { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--border-color); align-items: flex-start; }
.news-item:last-child { border-bottom: none; }
.news-thumb { width: 120px; height: 80px; border-radius: 8px; object-fit: cover; background: var(--bg-code); flex-shrink: 0; }
.news-body { flex: 1; min-width: 0; }
.news-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.news-source { background: var(--bg-code); padding: 2px 10px; border-radius: 10px; color: var(--text-secondary); font-weight: 500; }
.news-title { font-size: 1.05rem; font-weight: 600; margin: 4px 0 8px 0; line-height: 1.5; }
.news-title a { color: var(--text-primary); text-decoration: none; transition: color 0.15s; }
.news-title a:hover { color: #4a90d9; }
/* 显示语言：双语模式下的原文弱化显示 + 快捷切换按钮选中态 */
.news-title-orig { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-top: 4px; }
.news-excerpt-orig { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); color: var(--text-muted); font-size: 0.92em; }
.news-lang-btn.is-active { background: #1e2a3a !important; color: #fff !important; }
.news-excerpt { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 600px) { .news-thumb { width: 90px; height: 60px; } .news-title { font-size: 0.95rem; } }

/* ===== 搜索历史面板（task-9）：颜色一律走 CSS 变量，兼容深夜模式 ===== */
#searchHistoryPanel {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    z-index: 1000; max-height: 340px; overflow-y: auto;
}
#searchHistoryPanel[hidden] { display: none; }
#searchHistoryPanel .sh-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.8rem; }
#searchHistoryPanel .sh-clear { min-height: 44px; padding: 0 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; border-radius: 8px; }
#searchHistoryPanel .sh-clear:hover { background: var(--bg-code); color: var(--text-primary); }
#searchHistoryPanel .sh-row { display: flex; align-items: stretch; }
#searchHistoryPanel .sh-row.sh-active { background: var(--bg-code); }
#searchHistoryPanel .sh-item { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: transparent; border: none; cursor: pointer; text-align: left; color: var(--text-primary); font-size: 0.9rem; overflow: hidden; }
#searchHistoryPanel .sh-item:hover { background: var(--bg-code); }
#searchHistoryPanel .sh-icon { flex-shrink: 0; opacity: 0.7; }
#searchHistoryPanel .sh-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#searchHistoryPanel .sh-del { flex-shrink: 0; width: 44px; min-height: 44px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; border-radius: 8px; }
#searchHistoryPanel .sh-del:hover { background: var(--bg-code); color: var(--text-primary); }
</style>

<script>
(function () {
    const feed = document.getElementById('newsFeed');
    const statusEl = document.getElementById('newsStatus');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    const searchInput = document.getElementById('newsSearchInput');
    const searchBtn = document.getElementById('newsSearchBtn');
    const clearBtn = document.getElementById('newsClearBtn');

        const SOURCE_NAMES = {
        'MyAnimeList': '动漫百科',
        'Anime News Network': '动漫新闻网',
        'Anime Corner': '动漫角落',
        'Crunchyroll': 'Crunchyroll',
        'Comic Book': '漫画媒体',
        'Otaku USA': '宅文化美刊',
    };

    let currentTag = '';
    let nextCursor = null;
    let searchKeyword = '';

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function formatDate(s) {
        if (!s) return '';
        try {
            const d = new Date(s);
            if (isNaN(d.getTime())) return s.slice(0, 10);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + ' 天前';
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'numeric', day: 'numeric' });
        } catch (e) {
            return s.slice(0, 10);
        }
    }

    function thumbUrl(url) {
        if (!url) return '';
        return '/api/anime/news-image?url=' + encodeURIComponent(url);
    }

    function newsLangMode() {
        const v = document.documentElement.getAttribute('data-news-lang');
        return (v === 'original' || v === 'both') ? v : 'zh';
    }

    function itemHtml(a) {
        // 显示语言：译文优先 / 仅原文 / 双语对照（偏好来自「设置 → 语言与翻译」）
        const mode = newsLangMode();
        const zhTitle = a.title_zh ? a.title_zh : (a.title ? a.title : '(标题翻译中)');
        const origTitle = a.title ? a.title : '';
        let title;
        if (mode === 'original') {
            title = escapeHtml(origTitle || zhTitle);
        } else if (mode === 'both' && origTitle && origTitle !== zhTitle) {
            title = escapeHtml(zhTitle) + '<span class="news-title-orig">' + escapeHtml(origTitle) + '</span>';
        } else {
            title = escapeHtml(zhTitle);
        }
        const link = a.link || a.url || '#';
        const source = SOURCE_NAMES[a.source] || a.source || '';
        const date = formatDate(a.date || a.published_at);
        // 摘要：原文缺失时回落到译文，任一模式都不会出现空摘要
        const zhExcerpt = a.excerpt_zh ? a.excerpt_zh : '';
        const origExcerpt = a.excerpt ? a.excerpt : '';
        let excerpt = '';
        if (mode === 'original') {
            excerpt = escapeHtml(origExcerpt || zhExcerpt);
        } else if (mode === 'both') {
            if (zhExcerpt) {
                excerpt = escapeHtml(zhExcerpt);
                if (origExcerpt && origExcerpt !== zhExcerpt) {
                    excerpt += '<div class="news-excerpt-orig">' + escapeHtml(origExcerpt) + '</div>';
                }
            } else {
                excerpt = escapeHtml(origExcerpt);
            }
        } else {
            excerpt = escapeHtml(zhExcerpt);
        }
        const img = a.image ? thumbUrl(a.image) : '';

        const thumbHtml = img
            ? '<img class="news-thumb" src="' + escapeHtml(img) + '" loading="lazy" alt="" onerror="this.style.display=\'none\'">'
            : '';

        // 卡片直接链接到独立详情页，不再触发模态框
        const detailUrl = '/anime_news/article?url=' + encodeURIComponent(link);

        return '<div class="news-item">' +
            thumbHtml +
            '<div class="news-body">' +
                '<div class="news-meta">' +
                    (source ? '<span class="news-source">' + escapeHtml(source) + '</span>' : '') +
                    '<span>' + escapeHtml(date) + '</span>' +
                '</div>' +
                '<h3 class="news-title"><a href="' + detailUrl + '" class="news-link">' + title + '</a></h3>' +
                (excerpt ? '<div class="news-excerpt">' + excerpt + '</div>' : '') +
            '</div>' +
        '</div>';
    }

    function render(articles, append) {
        if (!append) feed.innerHTML = '';
        if (!articles.length && !append) {
            statusEl.style.display = 'block';
            statusEl.textContent = '暂无新闻';
            return;
        }
        statusEl.style.display = 'none';
        feed.insertAdjacentHTML('beforeend', articles.map(itemHtml).join(''));
        // 卡片是动态插入的，补一轮「从下往上淡入」（base.html 提供，减少动效时会自动跳过）
        if (window.acRiseCards) window.acRiseCards(feed);
    }

    function load(tag, append) {
        if (!append) {
            currentTag = tag;
            nextCursor = null;
            searchKeyword = '';
            if (searchInput) searchInput.value = '';
            if (clearBtn) clearBtn.style.display = 'none';

            filterBtns.forEach(function (b) {
                if (b.dataset.tag === tag) {
                    b.style.background = '#1e2a3a';
                    b.style.color = 'white';
                } else {
                    b.style.background = 'var(--bg-code)';
                    b.style.color = 'var(--text-primary)';
                }
            });
            feed.innerHTML = '';
            statusEl.style.display = 'block';
            statusEl.textContent = '加载中...';
            loadMoreBtn.style.display = 'none';
        } else {
            loadMoreBtn.textContent = '加载中...';
            loadMoreBtn.disabled = true;
        }

        let url = '/api/anime/news?limit=20';
        if (tag) url += '&tag=' + encodeURIComponent(tag);
        if (append && nextCursor) url += '&cursor=' + encodeURIComponent(nextCursor);

        fetch(url)
        .then(r => r.json())
        .then(data => {
            const articles = data.articles || [];
            render(articles, append);

            const meta = data.meta || {};
            nextCursor = meta.nextCursor || null;

            if (meta.hasMore && nextCursor) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.textContent = '加载更多';
                loadMoreBtn.disabled = false;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        })
        .catch(() => {
            statusEl.style.display = 'block';
            statusEl.textContent = '加载失败，请稍后再试';
            loadMoreBtn.style.display = 'none';
        });
    }

    // ===== 搜索 =====
    function doSearch() {
        const q = searchInput.value.trim();
        if (!q) return;
        searchKeyword = q;
        try { window.__recordSearchHistory && window.__recordSearchHistory(q); } catch (e) { /* 历史记录失败绝不影响搜索 */ }

        filterBtns.forEach(function (b) {
            b.style.background = 'var(--bg-code)';
            b.style.color = 'var(--text-primary)';
        });

        feed.innerHTML = '';
        statusEl.style.display = 'block';
        statusEl.textContent = '搜索中...';
        loadMoreBtn.style.display = 'none';
        clearBtn.style.display = 'inline-block';
        
        // 禁用搜索按钮并显示加载状态
        const originalBtnText = searchBtn.textContent;
        searchBtn.textContent = '搜索中...';
        searchBtn.disabled = true;
        searchBtn.style.opacity = '0.7';
        searchBtn.style.cursor = 'not-allowed';

        fetch('/api/anime/news-search?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(data => {
            const articles = data.articles || [];
            if (!articles.length) {
                feed.innerHTML = '';
                statusEl.style.display = 'block';
                statusEl.textContent = '没有找到相关新闻';
            } else {
                render(articles, false);
            }
        })
        .catch(() => {
            statusEl.textContent = '搜索失败，请稍后再试';
        })
        .finally(() => {
            // 恢复搜索按钮
            searchBtn.textContent = originalBtnText;
            searchBtn.disabled = false;
            searchBtn.style.opacity = '1';
            searchBtn.style.cursor = 'pointer';
        });
    }

    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            doSearch();
        }
    });
    clearBtn.addEventListener('click', function () {
        searchInput.value = '';
        searchKeyword = '';
        clearBtn.style.display = 'none';
        load('', false);
    });

    filterBtns.forEach(function (b) {
        b.addEventListener('click', function () {
            if (searchKeyword) {
                searchKeyword = '';
                searchInput.value = '';
                clearBtn.style.display = 'none';
            }
            load(b.dataset.tag, false);
        });
    });

    loadMoreBtn.addEventListener('click', function () {
        if (!searchKeyword) load(currentTag, true);
    });

    // 卡片点击已由链接 href 负责，无需额外绑定

    // ===== 显示语言快捷切换（与「设置 → 语言与翻译」共用同一个本地偏好） =====
    const langBtns = document.querySelectorAll('.news-lang-btn');
    function paintLangBtns() {
        const mode = newsLangMode();
        langBtns.forEach(function (b) {
            const on = b.dataset.lang === mode;
            b.classList.toggle('is-active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
    }
    langBtns.forEach(function (b) {
        b.addEventListener('click', function () {
            const mode = b.dataset.lang || 'zh';
            if (window.acPrefs && window.acPrefs.setNewsLang) {
                window.acPrefs.setNewsLang(mode);
            } else {
                document.documentElement.setAttribute('data-news-lang', mode);
            }
            paintLangBtns();
            // 重新渲染列表：服务端有缓存，代价很低；搜索态下沿用当前关键词
            if (searchKeyword) doSearch();
            else load(currentTag, false);
        });
    });
    paintLangBtns();

    load('', false);
})();
</script>

<script>
/* ===== 搜索历史（task-9）：自包含 IIFE，纯前端 localStorage，零网络请求、零日志 ===== */
(function () {
    'use strict';

    var STORAGE_KEY = 'anime_news_search_history_v1';
    var MAX_ITEMS = 10;

    var input = document.getElementById('newsSearchInput');
    var row = document.getElementById('newsSearchRow');
    if (!input || !row) return;

    var searchBtn = document.getElementById('newsSearchBtn');

    /* localStorage 安全包裹：隐私模式 / 配额满 / 被策略禁用时静默降级为「无历史」 */
    var store = {
        available: true,
        read: function () {
            if (!store.available) return [];
            try {
                var raw = window.localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                var arr = JSON.parse(raw);
                if (!Array.isArray(arr)) return [];
                var out = [];
                for (var i = 0; i < arr.length && out.length < MAX_ITEMS; i++) {
                    var v = arr[i];
                    if (typeof v !== 'string') continue;   /* 严格白名单：只接受字符串 */
                    v = v.trim();
                    if (v && out.indexOf(v) === -1) out.push(v);
                }
                return out;
            } catch (e) { store.available = false; return []; }
        },
        write: function (list) {
            if (!store.available) return false;
            try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
            catch (e) { store.available = false; return false; }
        }
    };

    var items = store.read();

    /* 由脚本设置定位上下文，避免改动原有那一行布局的内联样式 */
    row.style.position = 'relative';

    var panel = document.createElement('div');
    panel.id = 'searchHistoryPanel';
    panel.hidden = true;
    panel.setAttribute('role', 'listbox');
    panel.setAttribute('aria-label', '搜索历史');
    row.appendChild(panel);

    var activeIndex = -1;

    function isOpen() { return panel.hidden === false; }

    function closePanel() {
        panel.hidden = true;
        activeIndex = -1;
        input.setAttribute('aria-expanded', 'false');
    }

    function openPanel() {
        if (!items.length) { closePanel(); return; }
        panel.hidden = false;
        activeIndex = -1;
        input.setAttribute('aria-expanded', 'true');
    }

    function highlight(idx) {
        var rows = panel.querySelectorAll('.sh-row');
        for (var i = 0; i < rows.length; i++) { rows[i].classList.toggle('sh-active', i === idx); }
        activeIndex = idx;
        if (idx >= 0 && rows[idx]) { rows[idx].scrollIntoView({ block: 'nearest' }); }
    }

    /* 渲染：关键词是用户完全可控的字符串 —— 一律 textContent，绝不 innerHTML 拼接 */
    function render() {
        while (panel.firstChild) { panel.removeChild(panel.firstChild); }

        var header = document.createElement('div');
        header.className = 'sh-header';
        var label = document.createElement('span');
        label.textContent = '搜索历史';
        var clearAll = document.createElement('button');
        clearAll.type = 'button';
        clearAll.className = 'sh-clear';
        clearAll.textContent = '清空';
        clearAll.setAttribute('aria-label', '清空全部搜索历史');
        clearAll.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            items = [];
            store.write(items);
            render();
            closePanel();
        });
        header.appendChild(label);
        header.appendChild(clearAll);
        panel.appendChild(header);

        items.forEach(function (keyword, idx) {
            var rowEl = document.createElement('div');
            rowEl.className = 'sh-row';

            var itemBtn = document.createElement('button');
            itemBtn.type = 'button';
            itemBtn.className = 'sh-item';
            itemBtn.setAttribute('role', 'option');
            itemBtn.setAttribute('aria-selected', 'false');
            itemBtn.setAttribute('title', keyword);
            var icon = document.createElement('span');
            icon.className = 'sh-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = '\uD83D\uDD51';
            var text = document.createElement('span');
            text.className = 'sh-text';
            text.textContent = keyword;              /* ← 关键：textContent，免疫 XSS */
            itemBtn.appendChild(icon);
            itemBtn.appendChild(text);
            itemBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                input.value = keyword;
                closePanel();
                if (searchBtn) { searchBtn.click(); }   /* 复用既有搜索入口，不重写 doSearch */
            });

            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'sh-del';
            delBtn.textContent = '\u00D7';
            delBtn.setAttribute('aria-label', '删除这条搜索历史');
            delBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                items.splice(idx, 1);
                store.write(items);
                render();
                if (!items.length) { closePanel(); }
            });

            rowEl.appendChild(itemBtn);
            rowEl.appendChild(delBtn);
            panel.appendChild(rowEl);
        });
    }

    /* 记录一次搜索：去重 + 提到最前 + 截断到上限 */
    function record(keyword) {
        var k = String(keyword == null ? '' : keyword).trim();
        if (!k) return;
        var next = [k];
        for (var i = 0; i < items.length; i++) { if (items[i] !== k) { next.push(items[i]); } }
        items = next.slice(0, MAX_ITEMS);
        store.write(items);
        render();
        if (document.activeElement === input) { openPanel(); }
    }

    window.__recordSearchHistory = record;

    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-controls', 'searchHistoryPanel');

    input.addEventListener('focus', function () { if (items.length) { openPanel(); } });
    input.addEventListener('click', function () { if (items.length && !isOpen()) { openPanel(); } });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            if (isOpen()) { e.preventDefault(); e.stopPropagation(); closePanel(); }
            return;
        }
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') { return; }   /* 回车交给既有监听器 */
        e.preventDefault();
        e.stopPropagation();
        if (!isOpen()) { openPanel(); if (isOpen()) { highlight(0); } return; }
        var last = items.length - 1;
        if (e.key === 'ArrowDown') { highlight(activeIndex >= last ? 0 : activeIndex + 1); }
        else { highlight(activeIndex <= 0 ? last : activeIndex - 1); }
    });

    document.addEventListener('click', function (e) {
        if (isOpen() && !row.contains(e.target)) { closePanel(); }
    });

    render();
})();
</script>
