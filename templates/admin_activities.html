{% extends "base.html" %}
{% block title %}管理活动{% endblock %}
{% block content %}
<div class="admin-header">
    <h2>活动管理</h2>
    <a class="btn-add" href="{{ url_for('admin.admin_activity_add') }}">添加新活动</a>
</div>

<table class="admin-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>标题</th>
        <th>日期</th>
        <th>内容</th>
        <th class="u-dac4fe6c">操作</th>
    </tr>
    </thead>
    <tbody>
    {% for act in activities %}
    <tr>
        <td>{{ act.id }}</td>
        <td><strong>{{ act.title }}</strong></td>
        <td>{{ act.date }}</td>
        <td>{{ act.content[:50] }}{% if act.content|length > 50 %}...{% endif %}</td>
        <td class="u-dac4fe6c">
            <a class="btn-edit" href="{{ url_for('admin.admin_activity_edit', id=act.id) }}">编辑</a>
            <form method="POST" action="{{ url_for('admin.admin_activity_delete', id=act.id) }}"
                  style="display:inline;"
                  onsubmit="return confirm('确定删除？')">
                <button type="submit" class="btn-delete">删除</button>
            </form>
            <a class="btn-edit" href="{{ url_for('admin.admin_gallery') }}">照片墙</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
