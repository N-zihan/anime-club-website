[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Python 3.14 在 Linux 上 GC 时会刷大量「unclosed database」ResourceWarning：
# 来自测试用 SQLite 内存库的连接回收（fixture 已显式 dispose，仍有残留），
# 属于测试环境噪音，不影响用例结果，这里只静音这一类，其他 ResourceWarning 照常显示。
filterwarnings =
    ignore:unclosed database:ResourceWarning
