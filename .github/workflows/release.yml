name: Release

# 每次推送 v* 标签时，把标签自动发布成一个 GitHub Release：
# - 发布者会显示为 github-actions[bot]（和关注者活动流里那种一样）
# - 发布说明用 GitHub 自动生成的 release notes（基于提交/PR）
# - 支持在 Actions 页面手动 Run workflow，补建历史标签的 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建/更新的标签名（例如 v4.23.4）；留空则用当前分支最新的 v* 标签'
        required: false
        type: string
      latest:
        description: '是否设为 Latest Release（补建历史版本时请取消勾选）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -e
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          fi
          echo "target tag: $tag"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "标签 $tag 不存在，跳过"
            exit 0
          fi

          # 标签推送时 INPUT_LATEST 为空，按 true 处理
          latest="true"
          if [ -n "$INPUT_LATEST" ]; then
            latest="$INPUT_LATEST"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag 已存在"
            if [ "$latest" = "true" ]; then
              # 先确保不是草稿/预发布，否则「设为 Latest」会被 GitHub 以 422 拒绝
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --draft=false --prerelease=false --latest
              echo "已把 $tag 设为 Latest Release"
            fi
            exit 0
          fi

          if [ "$latest" = "true" ]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              --latest
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
          echo "已发布 Release $tag"
