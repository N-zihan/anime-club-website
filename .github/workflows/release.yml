name: Release

# 发行版策略：只给「功能版本」（vX.Y.0）自动发 GitHub Release，
# 补丁版本（vX.Y.Z，Z>0）只打 tag、不建 Release，避免发行版太频繁。
# - 自动触发：推送 vX.Y.0 标签时创建 Release，发布者为 github-actions[bot]
# - 手动触发：Actions 页面 Run workflow，可补建/更新任意标签的 Release（不受 x.y.0 限制）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建/更新的标签名（例如 v4.23.4）；留空则用当前分支最新的 v* 标签'
        required: false
        type: string
      latest:
        description: '是否设为 Latest Release（补建历史版本时请取消勾选）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="${REF_NAME}"
          fi
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          fi
          echo "target tag: $tag"

          # 自动触发（推标签）时只在「功能版本」x.y.0 发布 Release，
          # 补丁版本只打 tag 不建 Release，避免发行版太频繁；
          # 手动 Run workflow 时不受此限制（可补建任意标签）。
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.0$'; then
              echo "标签 $tag 是补丁版本，自动跳过（只发 x.y.0 功能版本）"
              exit 0
            fi
          fi

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "标签 $tag 不存在，跳过"
            exit 0
          fi

          # 标签推送时 INPUT_LATEST 为空，按 true 处理
          latest="true"
          if [ -n "$INPUT_LATEST" ]; then
            latest="$INPUT_LATEST"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag 已存在"
            if [ "$latest" = "true" ]; then
              # 先确保不是草稿/预发布，否则「设为 Latest」会被 GitHub 以 422 拒绝
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --draft=false --prerelease=false --latest
              echo "已把 $tag 设为 Latest Release"
            fi
            exit 0
          fi

          if [ "$latest" = "true" ]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              --latest
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi
          echo "已发布 Release $tag"
